name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0)'
        required: true
      release_note:
        description: "What's changed (single line summary)"
        required: false

permissions:
  contents: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Check actor is authorized
        run: |
          ALLOWED_ACTORS="leelakumili"
          if echo "$ALLOWED_ACTORS" | grep -qw "${{ github.actor }}"; then
            echo "Actor ${{ github.actor }} is authorized."
          else
            echo "::error::Actor ${{ github.actor }} is not authorized to run the release workflow."
            exit 1
          fi

  release:
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: '*.dmg'
          - os: windows-latest
            artifact: '*.exe'
          - os: ubuntu-latest
            artifact: '*.deb'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version
        run: npm version ${{ inputs.version }} --no-git-tag-version  

      - name: Build and package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set these secrets in your repo to sign the macOS build
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build

      - name: Verify macOS binary is universal (arm64 + x86_64)
        if: matrix.os == 'macos-latest'
        run: |
          APP=$(find release -maxdepth 3 -name 'Seen.app' | head -1)
          if [ -z "$APP" ]; then echo "::error::Seen.app not found under release/"; exit 1; fi
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          BIN="$APP/Contents/MacOS/$EXEC"
          echo "Architectures in $BIN:"
          lipo -archs "$BIN"
          for arch in arm64 x86_64; do
            lipo -archs "$BIN" | grep -qw "$arch" || { echo "::error::missing $arch slice — binary is not universal"; exit 1; }
          done
          SQLITE=$(find "$APP" -name 'better_sqlite3.node' | head -1)
          if [ -n "$SQLITE" ]; then
            echo "Architectures in $SQLITE:"
            lipo -archs "$SQLITE"
            for arch in arm64 x86_64; do
              lipo -archs "$SQLITE" | grep -qw "$arch" || { echo "::error::better_sqlite3.node missing $arch slice"; exit 1; }
            done
          fi

      - name: Upload release artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body: ${{ inputs.release_note }}
          files: release/${{ matrix.artifact }}
          draft: false
          generate_release_notes: true
